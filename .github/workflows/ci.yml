name: NeuroQuant CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit Tests & SIMD Benchmark Matrix
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build C++20 AVX2 Neuromorphic Core (Linux)
      if: runner.os == 'Linux'
      run: |
        g++ -std=c++20 -O3 -mavx2 -mfma -shared -fPIC -DLIF_EXPORTS -o csrc/liblif_core.so csrc/lif_core.cpp

    - name: Build C++20 AVX2 Neuromorphic Core (Windows)
      if: runner.os == 'Windows'
      run: |
        g++ -std=c++20 -O3 -mavx2 -mfma -shared -static -static-libgcc -static-libstdc++ -fPIC -DLIF_EXPORTS -o csrc/lif_core.dll csrc/lif_core.cpp

    - name: Run Automated Test Suite (18 Tests)
      run: |
        python -m unittest discover tests

    - name: Run Institutional C++20 SIMD Benchmark
      run: |
        python benchmarks/run_simd_benchmark.py

    - name: Run Institutional Veteran Quant Audit Benchmark
      run: |
        python benchmarks/run_veteran_audit.py
